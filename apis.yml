apis:
- aid: audible-magic:fulfillment-content-api
  name: Audible Magic Fulfillment Content API
  description: The Audible Magic Content API is a lightweight method to obtain media files from Audible Magic's Fulfillment
    services - an HTTP GET (with a cookie) taking a RetailerID, a ComponentID and an AssetType (bitrate/encoding) that returns
    the media file. Audible Magic's help desk also states its Fulfillment APIs are SOAP-based requests to the Audible Magic
    Service. Access requires explicit authorization and catalog configuration per retailer ID; no base URL, WSDL or OpenAPI
    is published.
  humanURL: https://support.audiblemagic.com/how-does-the-audible-magic-fulfillment-api-work
  tags:
  - Music Fulfillment
  - Media Delivery
  properties:
  - type: Documentation
    url: https://support.audiblemagic.com/how-does-the-audible-magic-fulfillment-api-work
  - type: Support
    url: https://support.audiblemagic.com/fulfillment-api-troubleshooting-required-info
- aid: audible-magic:identification-toolkit
  name: Audible Magic Identification Toolkit
  description: The Audible Magic Toolkit is a package of command-line programs (identify, analyze, identifyStream) for Linux,
    Windows and Mac that fingerprint unknown media files, package the fingerprints into an ID request posted to the Audible
    Magic backend, and return the identification response as JSON, driven by a Toolkit configuration file issued to customers.
  humanURL: https://support.audiblemagic.com/audible-magic-toolkit
  tags:
  - Content Identification
  - Audio Fingerprinting
  properties:
  - type: Documentation
    url: https://support.audiblemagic.com/audible-magic-toolkit
  - type: ReleaseNotes
    url: https://support.audiblemagic.com/toolkit-v61-release-notes
  - type: Errors
    url: https://support.audiblemagic.com/toolkit-errors

