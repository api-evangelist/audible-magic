aid: audible-magic

name: Audible Magic

description: Audible Magic is an automatic content recognition (ACR) and rights administration company whose content identification
  technology is used by platforms such as Twitch, SoundCloud and Dailymotion. Its products include identification services
  (ID360, Social Check, Article 17 compliance), rights management and licensing (Rights360, RightsRX, Admin360) and music
  fulfillment (Fulfillment360, the Fulfillment Content API and Cleared Catalog data feed), with an Audible Magic Toolkit and
  help-desk documentation for implementing its services.

